name: Build and release filebroker FFmpeg

on:
  push:
    branches:
      - release/9.0
    tags:
      - "filebroker-*"

permissions:
  contents: read

jobs:
  build:
    name: Build and test Linux x86_64
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie

    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            build-essential \
            pkg-config \
            nasm \
            libssl-dev \
            libx264-dev \
            libx265-dev \
            libsvtav1enc-dev \
            libaom-dev \
            libdav1d-dev \
            libvpx-dev \
            libwebp-dev \
            libjxl-dev \
            libopenjp2-7-dev \
            libopus-dev \
            libvorbis-dev \
            libmp3lame-dev \
            libtheora-dev \
            libspeex-dev \
            libgsm1-dev \
            libtwolame-dev \
            libass-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libxml2-dev \
            libzimg-dev \
            libsoxr-dev \
            liblcms2-dev

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: |
          ./configure \
            --enable-gpl \
            --enable-version3 \
            --enable-openssl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libsvtav1 \
            --enable-libaom \
            --enable-libdav1d \
            --enable-libvpx \
            --enable-libwebp \
            --enable-libjxl \
            --enable-libopenjpeg \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libmp3lame \
            --enable-libtheora \
            --enable-libspeex \
            --enable-libgsm \
            --enable-libtwolame \
            --enable-libass \
            --enable-libfreetype \
            --enable-libfontconfig \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-libxml2 \
            --enable-libzimg \
            --enable-libsoxr \
            --enable-lcms2 \
            --disable-ffplay \
            --disable-doc

      - name: Build
        run: |
          make -j"$(nproc)" ffmpeg ffprobe

      - name: Show build configuration
        run: |
          ./ffmpeg -version
          ./ffprobe -version

      - name: Test HLS fMP4 mehd output
        run: |
          mkdir -p /tmp/ffmpeg-test

          ./ffmpeg \
            -v error \
            -f lavfi \
            -i "testsrc=size=128x72:rate=30" \
            -t 2 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            /tmp/ffmpeg-test/input.mp4

          ./ffmpeg \
            -v error \
            -i /tmp/ffmpeg-test/input.mp4 \
            -c:v libx264 \
            -f hls \
            -hls_time 1 \
            -hls_playlist_type vod \
            -hls_flags single_file \
            -hls_segment_type fmp4 \
            -hls_segment_filename /tmp/ffmpeg-test/stream.m4s \
            /tmp/ffmpeg-test/stream.m3u8

          grep -a -q "mehd" /tmp/ffmpeg-test/stream.m4s

      - name: Validate installer template
        run: |
          sed \
            -e "s|@VERSION@|ci-test|g" \
            scripts/install.sh.in \
            > /tmp/install.sh

          bash -n /tmp/install.sh


  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/filebroker-')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate install script
        run: |
          mkdir -p dist

          sed \
            -e "s|@VERSION@|${GITHUB_REF_NAME}|g" \
            scripts/install.sh.in \
            > dist/install.sh

          chmod +x dist/install.sh
          bash -n dist/install.sh

      - name: Generate checksum
        working-directory: dist
        run: |
          sha256sum install.sh > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/install.sh" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --generate-notes


  docker:
    name: Publish Docker image
    needs: build
    if: startsWith(github.ref, 'refs/tags/filebroker-')
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
